name: Refresh dashboard data

on:
  schedule:
    - cron: "15 6 * * *" # daily, 06:15 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh cached snapshot
        run: python3 scripts/refresh_data.py
      - name: Commit if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard.json
          git diff --cached --quiet || git commit -m "chore: refresh cached dashboard snapshot"
          git push
